name: location_checker
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.2  # Get user location
  latlong2: ^0.9.1    # Calculate distance
  intl: ^0.20.2
  sqflite: ^2.0.0+4
  path_provider: ^2.0.11
  http: ^1.3.0
  path: ^1.8.3
  connectivity_plus: ^6.1.3
  table_calendar: ^3.0.5
  flutter_dotenv: ^5.2.1
  permission_handler: ^11.4.0
  geolocator_android: ^4.6.1
  shared_preferences: ^2.0.6
  video_player: ^2.9.3
  worldtime: ^1.4.2
  flutter_local_notifications: ^15.1.0
  timezone: ^0.9.4
  vibration: ^1.7.5
  image_picker: ^1.1.2
  photo_view: ^0.14.0
  url_launcher: ^6.1.7
  qr_flutter: ^4.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/background.png
    - assets/images/logo.jpeg
    - assets/data/credentials.json
    - assets/images/punchin.png
    - assets/images/presson.png
    - assets/images/punchout.png
    - assets/images/pressout.png
    - assets/images/totalhours.png
    - assets/images/insurance.jpg
    - assets/images/upscalemedia-transformed.png
    - assets/images/upscalemedia-transformed.jpeg
    - assets/images/red-logo-removebg-preview.png
    - assets/images/Hash_id_black.png
    - assets/images/Hash_id_black_contact.png
    - assets/videos/buffer.mp4
    - assets/images/loading.gif
    - .env
flutter_icons:
    android: true
    ios: true
    image_path: "assets/images/upscalemedia-transformed.png"